version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: sentinel_db
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: always

 
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentinel_app
    depends_on:
      - db
    environment:
      - DB_NAME=sentinel_db
      - DB_USER=admin
      - DB_PASS=admin123
      - DB_HOST=db
    restart: always